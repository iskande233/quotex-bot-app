workflows:
  flutter-android-debug:
    name: Quotex Bot App - Flutter Android Debug APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Android platform if missing
        script: |
          cd frontend
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.latchi .
          fi
      - name: Ensure Android internet permissions
        script: |
          cd frontend
          python3 -c "from pathlib import Path; p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text(); perms='\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n'; s=s.replace('<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">'+perms) if 'android.permission.INTERNET' not in s else s; p.write_text(s)"
      - name: Flutter pub get
        script: |
          cd frontend
          flutter pub get
      - name: Generate launcher icon
        script: |
          cd frontend
          dart run flutter_launcher_icons
      - name: Build debug APK
        script: |
          cd frontend
          BUILD_NUM=${BUILD_NUMBER:-${CM_BUILD_NUMBER:-$(date +%s)}}
          flutter build apk --debug --build-name=1.0.$BUILD_NUM --build-number=$BUILD_NUM
    artifacts:
      - frontend/build/app/outputs/flutter-apk/app-debug.apk
      - frontend/build/app/outputs/flutter-apk/*.apk

  flutter-android-release:
    name: Quotex Bot App - Flutter Android Release APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Android platform if missing
        script: |
          cd frontend
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.latchi .
          fi
      - name: Ensure Android internet permissions
        script: |
          cd frontend
          python3 -c "from pathlib import Path; p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text(); perms='\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n'; s=s.replace('<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">'+perms) if 'android.permission.INTERNET' not in s else s; p.write_text(s)"
      - name: Flutter pub get
        script: |
          cd frontend
          flutter pub get
      - name: Generate launcher icon
        script: |
          cd frontend
          dart run flutter_launcher_icons
      - name: Build optimized split release APKs
        script: |
          cd frontend
          BUILD_NUM=${BUILD_NUMBER:-${CM_BUILD_NUMBER:-$(date +%s)}}
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --build-name=1.0.$BUILD_NUM --build-number=$BUILD_NUM
    artifacts:
      - frontend/build/app/outputs/flutter-apk/*-release.apk
      - frontend/build/app/outputs/flutter-apk/*.apk
