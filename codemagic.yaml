workflows:
  flutter-android-debug:
    name: Quotex Bot App - Flutter Android Debug APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Android platform if missing
        script: |
          cd frontend
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.latchi .
          fi
      - name: Flutter pub get
        script: |
          cd frontend
          flutter pub get
      - name: Generate launcher icon
        script: |
          cd frontend
          dart run flutter_launcher_icons
      - name: Build debug APK
        script: |
          cd frontend
          flutter build apk --debug
    artifacts:
      - frontend/build/app/outputs/flutter-apk/app-debug.apk
      - frontend/build/app/outputs/flutter-apk/*.apk

  flutter-android-release:
    name: Quotex Bot App - Flutter Android Release APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Android platform if missing
        script: |
          cd frontend
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.latchi .
          fi
      - name: Flutter pub get
        script: |
          cd frontend
          flutter pub get
      - name: Generate launcher icon
        script: |
          cd frontend
          dart run flutter_launcher_icons
      - name: Build optimized split release APKs
        script: |
          cd frontend
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
    artifacts:
      - frontend/build/app/outputs/flutter-apk/*-release.apk
      - frontend/build/app/outputs/flutter-apk/*.apk
