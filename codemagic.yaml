workflows:
  flutter-android-debug:
    name: Quotex Bot App - Flutter Android Debug
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Flutter pub get
        script: |
          cd frontend
          flutter pub get
      - name: Build debug APK
        script: |
          cd frontend
          flutter build apk --debug
    artifacts:
      - frontend/build/app/outputs/flutter-apk/*.apk

  flutter-android-release:
    name: Quotex Bot App - Flutter Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Flutter pub get
        script: |
          cd frontend
          flutter pub get
      - name: Build release APK
        script: |
          cd frontend
          flutter build apk --release
    artifacts:
      - frontend/build/app/outputs/flutter-apk/*.apk
